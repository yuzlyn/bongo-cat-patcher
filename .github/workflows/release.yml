name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            BongoCatPatcher-portable.zip \
            --title "BongoCatPatcher $TAG_NAME" \
            --notes "Portable package for BongoCatPatcher. Includes the patch scripts and bundled dnlib dependency."
